architecture:
  version: 0.4
  subtree:
  - name: kv_systolic_array
    attributes:
      technology: "40nm"
      global_cycle_seconds: 1e-9
    local:
    # Single DRAM: KV load (stationary, loaded once) + Q reads + output writes
    - name: kv_dram
      class: DRAM
      attributes:
        width: 8
    # 64 PEs — one per query head (H=64)
    subtree:
    - name: PE[0..63]
      attributes:
        memory_width: 8
      local:
      # Stage 1: lower MAC — Q·K dot product (lower_mac_count=16 interleaved MACs)
      # Stage 2: upper running-attention PE — online softmax O update
      - name: mac
        class: intmac
        attributes:
          datawidth: 8
      # Q vector scratchpad: d=128 elements × 2 bytes = 256 bytes, read once per head
      - name: q_spad
        class: regfile
        attributes:
          depth: 256
          width: 8
          n_rdwr_ports: 1
      # K shift register: K[t] enters from DRAM, propagates row-to-row
      # Each PE holds d=128 elements × 2 bytes = 256 bytes instantaneously
      - name: k_spad
        class: regfile
        attributes:
          depth: 256
          width: 8
          n_rdwr_ports: 1
      # O accumulator: running output vector, d=128 elements × 2 bytes = 256 bytes
      - name: o_spad
        class: regfile
        attributes:
          depth: 256
          width: 8
          n_rdwr_ports: 1
